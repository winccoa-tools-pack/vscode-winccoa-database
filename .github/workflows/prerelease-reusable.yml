name: Reusable Action Pre-Release

on:
  workflow_call:
    inputs:
      target_branch:
        description: "Branch that triggered prerelease (e.g. release/v1.2.3)"
        required: true
        type: string
      validate_release_branch:
        description: "If true: require target_branch to be release/vX.Y.Z and match the computed version"
        required: false
        default: true
        type: boolean
      create_release:
        description: "Create GitHub pre-release and tag (false = upload workflow artifacts only)"
        required: false
        default: true
        type: boolean
    outputs:
      version:
        description: "Computed prerelease version (x.y.z-<shortsha>)"
        value: ${{ jobs.package.outputs.version }}
      tag:
        description: "Computed prerelease tag (v<version>)"
        value: ${{ jobs.package.outputs.tag }}

permissions:
  contents: write

concurrency:
  # Scoped to the branch so simultaneous release PRs don't queue behind each other
  group: release-pipeline-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  versioning:
    if: ${{ inputs.create_release }}
    uses: winccoa-tools-pack/.github/.github/workflows/versioning-tags-changelog-reusable.yml@main
    with:
      mode: prerelease
      target_branch: ${{ inputs.target_branch }}
      validate_release_branch: ${{ inputs.validate_release_branch }}
      push_tag: true
      force_push_tag: true
    secrets: inherit

  package:
    needs: [versioning]
    if: ${{ !cancelled() && (needs.versioning.result == 'success' || needs.versioning.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch != '' && inputs.target_branch || github.sha }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Set prerelease metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ needs.versioning.outputs.tag }}"
          if [ -z "$TAG" ]; then
            SHORT_SHA="${GITHUB_SHA:0:7}"
            TAG="dev-${SHORT_SHA}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension (VSIX)
        run: vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 14

  release:
    if: ${{ inputs.create_release }}
    needs: [versioning, package]
    runs-on: ubuntu-latest

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - name: Build release body
        id: body
        shell: bash
        run: |
          CHANGELOG="${{ needs.versioning.outputs.changelog }}"
          {
            echo "body<<EOF"
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
            fi
            echo "### 🔍 Testing Notes"
            echo "- This is a **pre-release** build; download the attached VSIX and test locally"
            echo "- Universal VSIX (no native dependencies, runs on all platforms)"
            echo "- Source branch: ${{ inputs.target_branch }}"
            echo "- Report issues at: https://github.com/${{ github.repository }}/issues"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          name: ${{ format('🧪 Pre-Release {0}', needs.package.outputs.tag) }}
          target_commitish: ${{ inputs.target_branch != '' && inputs.target_branch || github.sha }}
          body: ${{ steps.body.outputs.body }}
          files: "dist/*.vsix"
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
